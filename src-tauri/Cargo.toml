[package]
name = "shellnest"
version = "0.3.0"
edition = "2021"

[lib]
# Not "shellnest": a lib and a bin with one name collide on Windows.
name = "shellnest_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["fs", "poll"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
rand10 = { package = "rand", version = "0.10" }
