[package]
name = "shellnest"
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
# Not "shellnest": a lib and a bin with one name collide on Windows.
name = "shellnest_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
rand = "0.10"
base64 = "0.23"
zeroize = { version = "1", features = ["derive"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
russh-sftp = "3.0.1"
renamore = "0.3.2"
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.9"
thiserror = "2"

# Desktop only: the updater and the relaunch have no mobile build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { package = "keyring-core", version = "1" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# Keep the synchronous Secret Service backend without the deprecated zbus 5 crates.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[profile.release]
strip = true
lto = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
