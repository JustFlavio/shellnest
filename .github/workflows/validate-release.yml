name: Validate release
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub hides unpublished releases from tokens without push access.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate updater downloads without changing the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh release download "$TAG" --pattern latest.json --dir manifest
          gh api --paginate "repos/${{ github.repository }}/releases/$release_id/assets" --slurp > manifest/assets.json
          node .github/scripts/updater-manifest.ts check manifest/latest.json "${TAG#v}" manifest/assets.json
