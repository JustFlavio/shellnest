name: Release
on:
  push:
    tags: ["v*"]

jobs:
  # One job makes the draft release, so the parallel builds do not each create their own.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that the tag matches the app version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
      - name: Check that the updater public key is set
        run: |
          node -e '
            const key = require("./src-tauri/tauri.conf.json").plugins.updater.pubkey;
            if (Buffer.from(key, "base64").toString().includes("PLACEHOLDER")) {
              console.error("plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder (see docs/releases.md)");
              process.exit(1);
            }
          '
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="${{ github.ref_name }}" \
            -f name="Shellnest ${{ github.ref_name }}" \
            -f body="Alpha build, not code-signed. See CHANGELOG.md for what is in it and the README for first-launch warnings." \
            -F draft=true -F prerelease=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; unrelated to OS code signing. See docs/releases.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # Each job merges its platform into latest.json on the release; updater-manifest.yml checks it is complete.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
