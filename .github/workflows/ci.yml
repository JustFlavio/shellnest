name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo a pull request touches. lint and deny always run (cheap, and deny
  # catches advisories published after the last change); the rest only when their inputs
  # change. Pushes to main run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      bundle: ${{ steps.filter.outputs.bundle }}
      visual: ${{ steps.filter.outputs.visual }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE"...HEAD)
          else
            files=ALL
          fi
          printf 'Changed files:\n%s\n' "$files"
          # shared inputs: dependencies, toolchains and this workflow
          shared='package\.json|package-lock\.json|\.nvmrc|rust-toolchain\.toml|\.github/workflows/ci\.yml'
          web='src/|e2e/|index\.html|vite\.config\.ts|tsconfig[^/]*\.json|public/'
          check() {
            if [ "$files" = ALL ] || grep -Eq "^($1)" <<<"$files"; then echo "$2=true"; else echo "$2=false"; fi
          }
          {
            check "src/|src-tauri/|sync/|$shared" code
            check "src-tauri/|$shared" bundle
            check "$web|$shared" visual
            check "$web|src-tauri/|$shared" desktop
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm audit --omit=dev --audit-level=high

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml

  # Required checks are named per matrix entry ("test (macos-latest)"): skipping the whole job
  # would never report them, so the job runs and its steps skip when no code changed.
  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the Tauri Linux packages
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.changes.outputs.code == 'true'
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: src-tauri
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npm test
        if: needs.changes.outputs.code == 'true'
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        if: needs.changes.outputs.code == 'true'
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        if: needs.changes.outputs.code == 'true'
      # Authentication, the shell and SFTP against a real OpenSSH (src-tauri/test-fixtures/openssh).
      - name: OpenSSH tests
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        env:
          SHELLNEST_OPENSSH_CONTAINER: shellnest-openssh
        run: |
          docker build -t shellnest-openssh src-tauri/test-fixtures/openssh
          docker run -d --name shellnest-openssh -p 127.0.0.1::22 -p 127.0.0.1::2200 -p 127.0.0.1::2201 shellnest-openssh
          cargo test --locked --manifest-path src-tauri/Cargo.toml openssh_tests -- --ignored

  # Playwright on the browser preview. The snapshots are taken on macOS, so this runs there.
  visual:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium webkit
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-results
          path: test-results/
          retention-days: 7

  # WebDriver on the real app with an isolated vault (debug build, desktop-e2e feature).
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: desktop-e2e
      - run: npm ci
      - run: npm run test:desktop
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-results
          path: artifacts/desktop-e2e/
          retention-days: 7

  # The release builds on this runner image too: a broken Linux bundle shows up here, not on release day.
  bundle-linux:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the Tauri Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Update artifacts are off: they need the signing key, which pull requests do not get.
      - run: npx tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - run: ls -l src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage
